{% extends "home.html" %}

{% block content %}
    <h3 class='text-warning' style='letter-spacing: 2px;'>Searched for: '{{ keyword }}'</h3>
    <div class="row mb-2">
        {% for post in posts  %}
        <div class="col-md-6">
            <div class="card border-0" >
                <div class="card-body">
                    <a href="{% url 'blog' post.slug %}"><h3 class='text-dark'>{{ post.title }}</h3></a>
                    <small class="mb-1 text-muted">{{ post.created_at | timesince }} ago | {{ post.author }}</small>
                    <p class="card-text">{{ post.short_description | truncatewords:20 }}</p>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
{% endblock content %}
