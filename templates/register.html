{% extends 'home.html' %}
{% load crispy_forms_tags %}

{% block content %}
    <h3 class='text-center'>Registeration Form</h3>
    <form action="{% url 'register' %}" method="post" style='width:500px; margin:auto; margin-bottom: 4px;'>
        {% csrf_token %}
        {{ form | crispy }}
        <button type="submit" class='btn btn-warning'>Register</button>
    </form>
{% endblock %}
