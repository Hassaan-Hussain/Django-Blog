{% extends "home.html" %}
{% load crispy_forms_tags %}

{% block content %}

<div class="row">

    {% include "dashboard/sidebar.html" %}
    {% if perms.auth.view_user %}
    <div class="col-md-9">
        <form action="{% url 'add_user' %}" method="post">
            {% csrf_token %}
            {{ form | crispy }}
            <button type="submit" class='btn btn-primary'>Create User</button>
        </form>
    </div>
    {% else %}
    <h2>Access Denied!</h2>
    {% endif %}
</div>

{% endblock content %}
