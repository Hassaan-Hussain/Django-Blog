{% extends "home.html" %}
{% load crispy_forms_tags %}

{% block content %}

<div class="row">
    {% include "dashboard/sidebar.html" %}
    {% if perms.auth.view_user %}
    <div class="col-md-9">
        <h3>Edit User</h3>
        <form action="{% url 'edit_user' user.id %}" method="post">
            {% csrf_token %}
            {{ form | crispy }}
            <button type="submit" class='btn btn-primary'>Save</button>
            <a href="{% url "users" %}" class='btn btn-danger'>Cancel</a>
        </form>
    </div>
    {% else %}
    <h2>Access Denied!</h2>
    {% endif %}

</div>

{% endblock content %}
