{% extends 'home.html' %}
{% load crispy_forms_tags %}

{% block content %}

<div class="row">
    
    {% include 'dashboard/sidebar.html' %}
    
    <div class="col-md-9">
        <h2>Edit Post</h2>
        
        <form action="{% url 'edit_post' post.id %}" method='post' enctype='multipart/form-data'>
            {% csrf_token %}
            {{ form | crispy }}
            <button type="submit" class='btn btn-warning mb-5'>Save</button>
            <a href="{% url "categories" %}" class='btn btn-warning mb-5'>Cancel</a>
        </form>
    </div>
    
</div>


{% endblock content %}
